services:
  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    pull_policy: always
    user: "root"
    command:
      - server
      - local
      - --no-tutorials
    ports:
      - "8080:8080"
    volumes:
      - kestra_data:/app/storage
      - kestra_db:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./flow.yaml:/app/flows/flow.yaml:ro
      - ./input:/app/input:ro
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              username: admin@kestra.io
              password: Admin1234
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
        micronaut:
          server:
            port: 8080
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -u admin@kestra.io:Admin1234 http://localhost:8080/api/v1/configs >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kestra-flows:
    image: kestra/kestra:latest
    container_name: kestra-flows
    pull_policy: always
    depends_on:
      kestra:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -lc
      - /app/kestra flow updates /app/flows --namespace=company.marketing --no-delete --server=http://kestra:8080 --user=admin@kestra.io:Admin1234
    volumes:
      - ./flow.yaml:/app/flows/flow.yaml:ro
    restart: "no"

volumes:
  kestra_data:
  kestra_db:
