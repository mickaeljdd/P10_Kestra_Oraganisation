id: reconciliation_vins
namespace: company.marketing

description: >
  Pipeline de réconciliation ERP / WEB avec calcul du CA et détection des vins premium

inputs:
  - id: erp_file
    type: STRING
    defaults: /app/input/Fichier_erp.csv
  - id: web_file
    type: STRING
    defaults: /app/input/Fichier_web.csv
  - id: liaison_file
    type: STRING
    defaults: /app/input/fichier_liaison.csv

tasks:
  - id: run_data_quality_tests
    type: io.kestra.plugin.scripts.python.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    beforeCommands:
      - /usr/bin/python3 -m pip install --break-system-packages -r /app/project/requirements.txt

    commands:
      - |
        cd /app/project
        /usr/bin/python3 -m pytest -v \
          tests/test_data_quality.py \
          tests/test_xlsxtocsv.py \
          -p no:cacheprovider

  - id: build_reports
    type: io.kestra.plugin.jdbc.duckdb.Queries
    fetchType: FETCH_ONE
    communityExtensions: []
    outputFiles:
      - ca_by_product.csv
      - premium.csv
      - ordinaires.csv
    sql: |
      CREATE OR REPLACE TABLE erp AS
      SELECT * FROM read_csv_auto('{{ inputs.erp_file }}');

      CREATE OR REPLACE TABLE web AS
      SELECT * FROM read_csv_auto('{{ inputs.web_file }}');

      CREATE OR REPLACE TABLE liaison AS
      SELECT * FROM read_csv_auto('{{ inputs.liaison_file }}');

      CREATE OR REPLACE TABLE erp_clean AS
      SELECT DISTINCT *
      FROM erp
      WHERE product_id IS NOT NULL;

      CREATE OR REPLACE TABLE web_clean AS
      SELECT DISTINCT *
      FROM web
      WHERE sku IS NOT NULL
        AND total_sales IS NOT NULL
        AND post_type = 'product';

      CREATE OR REPLACE TABLE liaison_clean AS
      SELECT DISTINCT *
      FROM liaison
      WHERE product_id IS NOT NULL
        AND id_web IS NOT NULL;

      CREATE OR REPLACE TABLE final_join AS
      SELECT *
      FROM erp_clean e
      JOIN liaison_clean l
        ON e.product_id = l.product_id
      JOIN web_clean w
        ON CAST(l.id_web AS VARCHAR) = CAST(w.sku AS VARCHAR);

      CREATE OR REPLACE TABLE classified AS
      WITH ca_table AS (
        SELECT
          e.product_id,
          CAST(e.price AS DOUBLE) AS price,
          CAST(w.total_sales AS DOUBLE) AS total_sales,
          CAST(e.price AS DOUBLE) * CAST(w.total_sales AS DOUBLE) AS ca
        FROM final_join fj
        JOIN erp_clean e ON fj.product_id = e.product_id
        JOIN web_clean w ON CAST(fj.id_web AS VARCHAR) = CAST(w.sku AS VARCHAR)
      ),
      stats AS (
        SELECT
          AVG(price) AS avg_price,
          STDDEV_SAMP(price) AS std_price
        FROM ca_table
      )
      SELECT
        c.*,
        CASE
          WHEN s.std_price IS NULL OR s.std_price = 0 THEN 0
          ELSE (c.price - s.avg_price) / s.std_price
        END AS z_score,
        CASE
          WHEN s.std_price IS NOT NULL
            AND s.std_price != 0
            AND ((c.price - s.avg_price) / s.std_price) > 2 THEN 'premium'
          ELSE 'ordinaire'
        END AS categorie
      FROM ca_table c
      CROSS JOIN stats s;

      CREATE OR REPLACE TABLE ca_by_product AS
      SELECT
        product_id,
        SUM(ca) AS total_ca
      FROM classified
      GROUP BY product_id;

      COPY ca_by_product TO '{{ outputFiles["ca_by_product.csv"] }}' (HEADER, DELIMITER ',');

      COPY (
        SELECT * FROM classified WHERE categorie = 'premium'
      ) TO '{{ outputFiles["premium.csv"] }}' (HEADER, DELIMITER ',');

      COPY (
        SELECT * FROM classified WHERE categorie = 'ordinaire'
      ) TO '{{ outputFiles["ordinaires.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT COUNT(*) FROM erp_clean) AS erp_rows,
        (SELECT COUNT(*) FROM web_clean) AS web_rows,
        (SELECT COUNT(*) FROM liaison_clean) AS liaison_rows,
        (SELECT COUNT(*) FROM final_join) AS joined_rows,
        (SELECT COUNT(*) FROM classified) AS classified_rows,
        (SELECT COALESCE(SUM(ca), 0) FROM classified) AS total_ca,
        (SELECT COUNT(*) FROM classified WHERE categorie = 'premium') AS premium_rows;

  - id: generate_excel_report
    type: io.kestra.plugin.scripts.python.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    inputFiles:
      ca_by_product.csv: >-
        {{ outputs.build_reports.outputFiles['ca_by_product.csv'] }}
      premium.csv: >-
        {{ outputs.build_reports.outputFiles['premium.csv'] }}
      ordinaires.csv: >-
        {{ outputs.build_reports.outputFiles['ordinaires.csv'] }}

    outputFiles:
      - revenue_report.xlsx

    commands:
      - |
        /usr/bin/python3 - <<'PY'
        import pandas as pd

        ca = pd.read_csv("ca_by_product.csv")
        premium = pd.read_csv("premium.csv")
        ordinaires = pd.read_csv("ordinaires.csv")

        total_ca = round(ca["total_ca"].sum(), 2)

        synthese = pd.DataFrame(
            {
                "indicateur": [
                    "Nombre de produits",
                    "Chiffre d'affaires total",
                    "Nombre de vins premium",
                    "Nombre de vins ordinaires",
                ],
                "valeur": [
                    len(ca),
                    total_ca,
                    len(premium),
                    len(ordinaires),
                ],
            }
        )

        with pd.ExcelWriter(
            "revenue_report.xlsx",
            engine="openpyxl",
        ) as writer:
            synthese.to_excel(
                writer,
                sheet_name="Synthese",
                index=False,
            )
            ca.to_excel(
                writer,
                sheet_name="CA par produit",
                index=False,
            )
            premium.to_excel(
                writer,
                sheet_name="Vins premium",
                index=False,
            )
            ordinaires.to_excel(
                writer,
                sheet_name="Vins ordinaires",
                index=False,
            )
        PY
  - id: test_generated_reports
    type: io.kestra.plugin.scripts.python.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    beforeCommands:
      - /usr/bin/python3 -m pip install --break-system-packages pandas openpyxl pytest

    inputFiles:
      ca_by_product.csv: "{{ outputs.build_reports.outputFiles['ca_by_product.csv'] }}"
      premium.csv: "{{ outputs.build_reports.outputFiles['premium.csv'] }}"
      ordinaires.csv: "{{ outputs.build_reports.outputFiles['ordinaires.csv'] }}"
      revenue_report.xlsx: "{{ outputs.generate_excel_report.outputFiles['revenue_report.xlsx'] }}"

    commands:
      - /usr/bin/python3 -m pytest -v /app/project/tests/test_generated_reports.py
# =========================
# 8. PLANIFICATION
# =========================

triggers:
  - id: monthly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 15 * *"

# =========================
# 9. GESTION DES ERREURS
# =========================

retry:
  type: constant
  maxAttempt: 3
  interval: PT5M